<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Página não encontrada | AirNext</title>
  <meta name="description" content="Esta página não existe ou mudou de endereço.">
  <link rel="icon" href="/favicon.png">
  <style>
    :root{color-scheme:dark light}
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:#050507;color:#f5f5f7;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center}
    main{max-width:30rem}
    h1{font-size:clamp(2rem,6vw,3rem);line-height:1.05;letter-spacing:-.04em;margin:0 0 .75rem}
    p{color:#a1a1aa;line-height:1.55;margin:0 0 1.5rem}
    nav{display:flex;flex-wrap:wrap;gap:.75rem;justify-content:center}
    a{display:inline-block;padding:.7rem 1.4rem;border-radius:999px;font-weight:600;text-decoration:none}
    a.primary{background:#fff;color:#000}
    a.ghost{border:1px solid rgba(255,255,255,.25);color:#fff}
    a:focus-visible{outline:2px solid #5ac8fa;outline-offset:2px}
  </style>
</head>
<body>
  <main>
    <h1>Página não encontrada</h1>
    <p>O endereço que você abriu não existe ou mudou. Volte para o início ou fale com a gente.</p>
    <nav>
      <a class="primary" href="/">Ir para o início</a>
      <a class="ghost" href="/suporte">Suporte</a>
      <a class="ghost" href="/contato">Contato</a>
    </nav>
  </main>
</body>
</html>
